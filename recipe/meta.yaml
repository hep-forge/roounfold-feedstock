{% set versions = {
    "3.1.0": "14d83344c8f361e0738fb99af0dd1291db05fefc9b763b8749402235be3d755c"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}
{% set root_tag = (root or '')|replace('.', '') %}

{% set name = environ.get('ANACONDA_PACKAGE', 'roounfold')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://gitlab.cern.ch/RooUnfold/RooUnfold/-/archive/{{ version }}/RooUnfold-{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}
  patches:
    # ROOT 6.40 merged libRooFitJSONInterface into libRooFitHS3; find
    # whichever one this ROOT has (from conda-forge's roounfold recipe).
    - patches/roofit-json-optional-components.patch
    - patches/fix-aarch64-createhist-symbol.patch

build:
  number: 0
  string: "root{{ root_tag }}"
  skip: true  # [not linux]
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - python
    - root {{ root }}.*
    - root-guard
  run:
    - python
    - root {{ root }}.*
    - root-guard

test:
  imports:
    - RooUnfold
  commands:
    - test -f "${PREFIX}/lib/libRooUnfold.so"
    - python -c "import ROOT, RooUnfold; ROOT.RooUnfoldBayes"

about:
  home: https://gitlab.cern.ch/RooUnfold/RooUnfold
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Unfolding framework for ROOT (Bayes, SVD, TUnfold, IDS, GP, Poisson)
  description: |
    RooUnfold unfolds (deconvolves) measured distributions. It runs from
    the ROOT prompt, from Python, or linked into C++ code, and implements
    iterative Bayesian, SVD, bin-by-bin, TUnfold, matrix inversion, IDS,
    Gaussian-process and Poisson unfolding.

extra:
  recipe-maintainers:
    - meiyasan
